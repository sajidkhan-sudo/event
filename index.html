<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVENT</title>
    <link
    rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous"/>
    <style>
      .box{
        height: 300px;
        width: 300px;
        background-color: #8c0909;
        display: inline-block;
      }
      .box1 {
        height: 300px;
        width: 300px;
        background-color: #97124b;
        display: inline-block;
        margin: 0 90px;      }
      img { 
        height: 300px;
        width: 300px;
      }

      input :focus {
        box-shadow: none !important;
      }
      
      .boxsqr {
        height: 300px;
        width: 300px;
      }

      
    </style>
  </head>
  <body>
    <section>
      <h1 class="bg-primary p-4 m-4 text-white">Events</h1>
      <div class="container">
        <div class="row">
          <div class="col-md-12">
            <div class="eventInfo">
                <button class="btn btn-primary text-white my-4" id="btnInfo">Dblclick</button>
                <button class="btn btn-primary text-white my-4" id="btnshow">Show</button>
                <button class="btn btn-primary text-white my-4" id="btnhide">Hide</button>
                <button class="btn btn-primary text-white my-4" id="btntoggle">Toggle</button>
                <button class="btn btn-primary text-white my-4" id="custombtn">dual</button>
                <div id="box"></div>
            </div>
          </div>
        </div>
      </div>
    </section>


    <hr>
    <hr>
    <hr>


    
    <div class="container">
      <h2 class="h2">Mouse Event</h2>
      <div class="row">
        <div class="col-md-12">
          <div class="box" id="box1">

          </div>
          <div class="box1" id="box2">

          </div>
        </div>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZtoOyvfTJtuMCJDSOTdBKSqM2am8gH9dednH14pWUaQ&s=10" id="skill" alt="mountain" class="img-fluid" title="js">
      </div>
    </div>



    <section class="mt-5">
      <div class="container">
        <div class="row">
          <div class="col-md-12">
            <input type="text" class="form-control" value="name" id="fnameInfo">
            <br>
            <input type="text" class="form-control" id="emailInfo">

            <div class="col-md-12 m-5">
              <select name="" id="selectedCl">
                <option value="green">Green</option>
                <option value="violet">Violet</option>
                <option value="blue">Blue</option>
                <option value="aliceblue">Aliceblue</option>
                <option value="brown">Brown</option>
                <option value="black">Black</option>
              </select>
              
              <div class="boxsqr mt-3" id="body"></div>
              
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="./assets/js/app.js"></script>
  </body>
</html>
